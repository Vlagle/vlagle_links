<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eee5">
  <meta name="description" content="memory.photo.ekb — фотографии и памятные фотоподарки">
  <title>memory.photo.ekb</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f1e9;
      --paper: #f7f0e8;
      --text: #51483f;
      --muted: #8c8175;
      --line: #d8cbbb;
      --accent: #b8a28a;
      --accent-dark: #8d7863;
      --shadow: 0 18px 45px rgba(105, 89, 70, .10);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.8), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(222,207,190,.35), transparent 30%),
        var(--bg);
      font-family: "Montserrat", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .page {
      width: min(100%, 620px);
      text-align: center;
      padding: 38px 30px 34px;
      background: var(--paper);
      border: 1px solid rgba(184,162,138,.25);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: block;
      width: min(100%, 300px);
      height: auto;
      margin: 0 auto 18px;
      border-radius: 4px;
    }

    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(32px, 7vw, 46px);
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1;
      color: var(--text);
    }

    .subtitle {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 14px 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: rgba(255,255,255,.46);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .02em;
      transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.78);
      border-color: var(--accent);
      box-shadow: 0 9px 22px rgba(105,89,70,.09);
    }

    .link:active { transform: translateY(0); }

    .divider {
      width: 72px;
      height: 1px;
      background: var(--line);
      margin: 28px auto 20px;
      position: relative;
    }

    .divider::after {
      content: "♥";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -54%);
      padding: 0 7px;
      background: #f8f2ea;
      color: var(--accent);
      font-size: 11px;
    }

    footer {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .05em;
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .page {
        padding: 28px 18px 24px;
        border-radius: 22px;
      }
      .logo {
        width: min(100%, 265px);
        margin-bottom: 12px;
      }
      .subtitle {
        margin-bottom: 22px;
        font-size: 11px;
      }
      .link {
        min-height: 54px;
        font-size: 13px;
        border-radius: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="logo" src="logo.png" alt="memory.photo.ekb">

      <a class="link" href="https://www.tiktok.com/@memory.photo.ekb?_r=1&_t=ZS-98s2uP5EZa3" target="_blank" rel="noopener noreferrer">TikTok</a>

    </nav>

    <div class="divider"></div>
    <footer>memory.photo.ekb</footer>
  </main>
</body>
</html>
